<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Круассанье</title>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-dark: rgb(83, 117, 60);
            --brown: rgb(156, 107, 48);
            --cream: rgb(239, 235, 220);
            --white-mint: rgb(244, 248, 244);
            --dark-grey: rgb(85, 93, 97);
        }
        
        body { font-family: 'Roboto', sans-serif; background-color: var(--white-mint); color: var(--dark-grey); margin: 0; padding: 0; }

        /* Первый экран - теперь только логотип и кнопка */
        .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        
        /* Увеличенный логотип */
        .hero img { max-width: 320px; width: 100%; height: auto; margin-bottom: 40px; }
        
        .hero p { color: var(--green-dark); font-size: 1.2rem; margin-bottom: 30px; font-weight: bold; }

        .container { max-width: 480px; margin: 0 auto; padding: 0 15px 40px; }
        
        .section { background: white; padding: 25px; border-radius: 25px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { font-family: 'Amatic SC', cursive; color: var(--green-dark); font-size: 2rem; margin: 0 0 15px 0; }

        .btn { 
            display: block; 
            background: var(--brown); 
            color: white; 
            padding: 16px; 
            margin: 10px 0; 
            text-decoration: none; 
            border-radius: 15px; 
            font-weight: 700; 
            font-size: 1.1rem;
            text-align: center;
            transition: 0.3s;
        }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <section class="hero">
        <!-- Логотип увеличен до max-width: 320px -->
        <img src="logo.png" alt="Круассанье">
        
        <p>из Франции с любовью</p>
        <a href="https://kryassanie.menuquickresto.ru" class="btn">Посмотреть меню</a>
    </section>

    <div class="container">
        <div class="section">
            <h2>О проекте</h2>
            <p>Волшебное путешествие в мир французской кулинарии. Мы объединяем мастерство традиций и уют нашего города.</p>
        </div>

        <div class="section" style="background: var(--cream);">
            <h2>Бонусная карта</h2>
            <a href="https://t.me/kryassanie_bot" class="btn">Заказать через Telegram-бот</a>
            <a href="https://apps.apple.com/us/app/круассанье/id6756950941" class="btn">Скачать в App Store</a>
            <a href="https://play.google.com/store/apps/details?id=ru.foodapp.loyalty.musiecourasanie" class="btn">Скачать в Google Play</a>
        </div>

        <div class="section">
            <h2>Мы на карте</h2>
            <p>просп. Мира, 85</p>
            <a href="https://yandex.ru/maps/org/kruassanye/123056124822" class="btn">Яндекс.Карты</a>
            <a href="https://2gis.ru/krasnoyarsk/geo/70000001100880232" class="btn">2ГИС</a>
        </div>
    </div>

</body>
</html>
